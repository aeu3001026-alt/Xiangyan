        document.getElementById("loginForm").addEventListener("submit", function(event) {
    // 1. Grab the values from the input fields
    const usernameInput = document.getElementById("username").value.trim();
    const passwordInput = document.getElementById("password").value;

    // 2. Define validation rules (Regular Expressions)
    // Username: 3-16 characters, letters, numbers, underscores, or hyphens
    const usernameRegex = /^[a-zA-Z0-9_-]{3,16}$/;
    
    // Password: At least 8 characters, contains at least 1 letter and 1 number
    const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;

    // 3. Validate Username
    if (!usernameRegex.test(usernameInput)) {
        event.preventDefault(); // Stop form from submitting
        alert("Invalid Username!\n• Must be 3 to 16 characters long.\n• No spaces allowed.\n• Only letters, numbers, hyphens(-), or underscores(_) allowed.");
        return; // Stop checking further if username fails
    }

    // 4. Validate Password
    if (!passwordRegex.test(passwordInput)) {
        event.preventDefault(); // Stop form from submitting
        alert("Invalid Password!\n• Must be at least 8 characters long.\n• Must contain at least one letter.\n• Must contain at least one number.");
        return;
    }

    // If both pass, the form will naturally submit successfully!
    alert("Validation successful! Logging you in...");
});
